<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>FoamAngel32's Website</title>
    <link rel="icon" href="img/foamangel32_3.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body id="body_id" style="margin: 0; min-height: 100vh;overflow-x: hidden;">
    <div id="EnglishPage">
        <div id="nav-card" style="text-align: center;">
            <div class="nav-item-container">
                <a href="index.html" class="nav-square" onclick="stop_index_anim()">Home</a>
                <a href="blogs.html" class="nav-square" onclick="stop_index_anim()">My Blog</a>
                <span>Tracks</span>
            </div>
        </div>
    </div>
    <div id="ChinesePage">
        <div id="nav-card" style="text-align: center;">
            <div class="nav-item-container">
                <a href="index.html" class="nav-square" onclick="stop_index_anim()">主页</a>
                <a href="blogs.html" class="nav-square" onclick="stop_index_anim()">我的博客</a>
                <span>音轨</span>
            </div>
        </div>
    </div>
    <div class="audioPlayer">
        <img id="audioPlayer-Cover" src="img/cover/temp.png" style="justify-content: center; align-items: center; gap: 10px; width: 20%; height: 20%; image-rendering: pixelated;">
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
            <button
                style="border: none;background-color: #1a2f46;color: #fff;padding: 8px 16px;border-radius: 6px;cursor: pointer;"
                onclick="last_song()">&lt;last</button>
            <h3 id="audioPlayer-Title"></h3>
            <button
                style="border: none;background-color: #1a2f46;color: #fff;padding: 8px 16px;border-radius: 6px;cursor: pointer;"
                onclick="next_song()">next&gt;</button>
        </div>
        <audio controls id="audioPlayer-Audio">
            <source id="audioPlayer-Source" src="mus/counter-clockwise_tower.wav" type="audio/wav">
            Your browser does not support the audio element.
        </audio>
    </div>
    <hr style="width: 40%; margin: 30px auto; border: none; border-top: 2px solid #222;">
    <h1>Track List</h1>
    <div id="trackList"></div>
    <div style="text-align: center;">
        <select id="languageSelect" onchange="langSet(this)">
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
        </select>
    </div>
    <footer>
        <p style="color:#1a2f2f;text-shadow: 0 0px 3px rgba(255, 255, 255, 0);">© 2026 FoamAngel32. All rights reserved.
        </p>
    </footer>
    <div id="bg" class="rectangle-back"></div>
    <button id="btn_toggle_theme" title="Click here to toggle theme" onclick="toggle_theme()"
        class="dark_mode_toggle_no_anim">
        <img id="theme_toggle" src="img/button_toggle_theme_dark.png" alt="toggle theme">
    </button>
</body>

</html>
<script>
    let dark_mode = localStorage.getItem('cloovar_website_dark_mode');
    let language = localStorage.getItem('cloovar_website_language');
    if (dark_mode === null) {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            dark_mode = 'true';
        else
            dark_mode = 'false';
    }
    if (language === null) {
        if (navigator.language.startsWith('zh'))
            language = "zh-CN";
        else
            language = "en-US";
    }
    document.getElementById('bg').style.transition = 'none'
    document.body.style.transition = 'none';
    set_theme();
    setTimeout(() => {
        document.getElementById('bg').style.transition = 'all 0.5s ease'
        document.body.style.transition = 'all 0.5s ease';
    }, 1);
    let current_song_id = 0;
    document.getElementById('languageSelect').value = language;
    langSet(document.getElementById('languageSelect'));
    let track_data;
    track_data = loadTracks();
    async function loadTracks() {
        try {
            const response = await fetch('tracks.json');
            track_data = await response.json();
            let track_id = 1;
            for (const trackName of track_data["o"]) {
                const p = document.createElement('p')
                p.textContent = track_id + ". " + trackName
                p.id = "trackList-track" + (track_id - 1);
                document.getElementById('trackList').appendChild(p);
                track_id++;
            }
            update_song();
            return track_data;
        } catch (error) {
            console.error('INDEX ERROR WHILE LOADING:', error);
            if (language === "zh-CN") {
                alert("音轨索引加载失败! 请刷新页面! ")
            } else {
                alert("Tracks index load failed! Please refresh! ")
            }
        }
    }
    function next_song() {
        if (current_song_id < (track_data["o"].length - 1)) {
            current_song_id += 1;
        }
        update_song()
    }
    function last_song() {
        if (current_song_id > 0) {
            current_song_id -= 1;
        }
        update_song()
    }
    function update_song() {
        document.getElementById('audioPlayer-Title').textContent = track_data["o"][current_song_id];
        document.getElementById('audioPlayer-Source').src = "mus/" + track_data["t"][track_data["o"][current_song_id]][0];
        document.getElementById('audioPlayer-Source').type = track_data["t"][track_data["o"][current_song_id]][1];
        const audio = document.getElementById('audioPlayer-Audio');
        const playing = !audio.paused;
        audio.load();
        if (playing) { 
            audio.addEventListener('canplay', () => {
                audio.play()
            }, { once: true });
        }
        const div = document.getElementById('trackList');

        div.querySelectorAll('p').forEach(p => {
            p.style.fontWeight = '';
        });
        document.getElementById('trackList-track' + current_song_id).style.fontWeight = 'bold';
    }
    function toggle_theme() {
        if (dark_mode === 'true')
            dark_mode = 'false';
        else
            dark_mode = 'true';
        localStorage.setItem('cloovar_website_dark_mode', dark_mode);
        set_theme();
    }
    function set_theme() {
        if (dark_mode === 'true') {
            // document.getElementById('logo').style.color = 'white';
            // document.getElementById('logo2').style.color = 'white';
            document.getElementById('body_id').style.backgroundColor = 'black';
            document.getElementById('body_id').classList.add('dark-mode');
            document.getElementById('body_id').classList.remove('light-mode');
            document.getElementById('theme_toggle').src = 'img/button_toggle_theme_dark.png';
        } else {
            // document.getElementById('logo').style.color = 'black';
            // document.getElementById('logo2').style.color = 'black';
            document.getElementById('body_id').style.backgroundColor = 'white';
            document.getElementById('body_id').classList.add('light-mode');
            document.getElementById('body_id').classList.remove('dark-mode');
            document.getElementById('theme_toggle').src = 'img/button_toggle_theme_light.png';
        }
    }
    function langSet(lang) {
        if (lang.value === 'zh-CN') {
            language = 'zh-CN';
            document.getElementById('btn_toggle_theme').title = '点击切换主题';
            document.title = "赖阿包55的网站 - REMIX";
            document.getElementById('ChinesePage').style.display = 'block';
            document.getElementById('EnglishPage').style.display = 'none';
            document.documentElement.lang = 'zh-CN';
        } else {
            language = 'en-US';
            document.getElementById('btn_toggle_theme').title = 'Click here to toggle theme';
            document.title = "FoamAngel32's Website - REMIX";
            document.getElementById('ChinesePage').style.display = 'none';
            document.getElementById('EnglishPage').style.display = 'block';
            document.documentElement.lang = 'en';
        }
        localStorage.setItem('cloovar_website_language', language);
    }
    function stop_index_anim() {
        localStorage.setItem('cloovar_website_stop_first_animation', '0');
    }

</script>
